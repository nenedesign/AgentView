<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{REPORT_TITLE}}</title>
<style>{{REPORT_CSS}}</style>
</head>
<body>

<div class="notice" role="note" aria-label="Report handling notice">
  {{REPORT_NOTICE}}
</div>

<div class="top-meta">
  <div class="brand">AgentView report</div>
  <div>{{TOP_META}}</div>
</div>

<section class="summary-card" aria-label="Run summary">
  <div class="summary-hero">
    <div class="summary-glyph summary-glyph--{{SUMMARY_CLASS}}" aria-hidden="true">{{SUMMARY_GLYPH}}</div>
    <div>
      <div class="summary-headline">{{SUMMARY_HEADLINE}}</div>
      <div class="summary-sub">{{SUMMARY_SUB}}</div>
    </div>
  </div>
  {{FACTS_HTML}}
</section>

<div class="section-heading">What the agent did, step by step</div>

{{TIMELINE_HTML}}

<section class="narrative">
  <h2>In one paragraph</h2>
  <p>{{NARRATIVE_PARAGRAPH}}</p>
</section>

<footer class="footer">
  <p>Generated by <strong>AgentView</strong>. Single-file HTML, offline, no network requests.</p>
</footer>

<script type="application/json" id="agentview-data">{{REPORT_DATA}}</script>

</body>
</html>
